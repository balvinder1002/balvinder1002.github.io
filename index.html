<html lang="en">

<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Tokens: see MASTER.md (Liquid glass). Change values here, never in the rules below. */
  :root{
    --bg: #0A0F1E;
    --ink: #EEF2FF;
    --soft: #AEB8D3;
    --accent: #7DD3FC;
    --accent-glow: rgba(125,211,252,0.35);
    --on-accent: #06202E;
    --pass: #6EE7A0;
    --pass-tint: rgba(110,231,160,0.12);
    --glass: rgba(14,20,40,0.42);
    --glass-strong: rgba(255,255,255,0.07);
    --glass-fallback: rgba(14,20,40,0.88);
    --edge: rgba(255,255,255,0.45);
    --sheen: rgba(255,255,255,0.07);
    --hair: rgba(255,255,255,0.10);
    --lens: rgba(125,211,252,0.10);
    --shadow: 0 24px 60px rgba(0,0,0,0.35);
    --orb-a: rgba(56,189,248,0.42);
    --orb-b: rgba(139,92,246,0.40);
    --orb-c: rgba(45,212,191,0.32);

    --display: 'Inter Tight', 'Arial Narrow', system-ui, sans-serif;
    --body: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;

    --blur: 24px;
    --ease: cubic-bezier(0.2, 0, 0, 1);
    --ease-enter: cubic-bezier(0.05, 0.7, 0.1, 1);
    --t-quick: 90ms;
    --t-standard: 180ms;
    --maxw: 1200px;
    --gutter: 24px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg: #E8EDF7;
      --ink: #0E1428;
      --soft: #3F4862;
      --accent: #0369A1;
      --accent-glow: rgba(3,105,161,0.28);
      --on-accent: #FFFFFF;
      --pass: #166534;
      --pass-tint: rgba(22,101,52,0.10);
      --glass: rgba(255,255,255,0.62);
      --glass-strong: rgba(255,255,255,0.75);
      --glass-fallback: rgba(255,255,255,0.80);
      --edge: rgba(255,255,255,0.95);
      --sheen: rgba(255,255,255,0.40);
      --hair: rgba(14,20,40,0.09);
      --lens: rgba(3,105,161,0.08);
      --shadow: 0 20px 50px rgba(30,45,90,0.14);
      --orb-a: rgba(56,189,248,0.45);
      --orb-b: rgba(167,139,250,0.45);
      --orb-c: rgba(94,234,212,0.40);
      color-scheme: light;
    }
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow-x: clip;
  }
  h1,h2,h3{ font-family: var(--display); font-weight: 600; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
  p{ margin: 0; text-wrap: pretty; }
  a{ color: inherit; }
  a, button{ outline: 2px solid transparent; outline-offset: 6px; }
  :focus-visible{ outline-color: var(--accent); outline-offset: 3px; }
  .mono{ font-family: var(--mono); font-size: 12.5px; }
  .soft{ color: var(--soft); }

  /* ---------- page, orbs ---------- */
  .page{ position: relative; overflow: clip; container: page / inline-size; min-height: 100vh; }
  .orbs{ position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .orb{ position: absolute; border-radius: 50%; filter: blur(70px); }
  .orb-1{ width: 620px; height: 620px; left: -160px; top: -120px; background: var(--orb-a); }
  .orb-2{ width: 520px; height: 520px; right: -120px; top: 260px; background: var(--orb-b); }
  .orb-3{ width: 560px; height: 560px; left: 30%; top: 30%; background: var(--orb-c); }
  .orb-4{ width: 480px; height: 480px; right: -80px; top: 50%; background: var(--orb-a); }
  .orb-5{ width: 640px; height: 640px; left: -200px; top: 68%; background: var(--orb-b); }
  .orb-6{ width: 420px; height: 420px; right: 10%; bottom: -100px; background: var(--orb-c); }
  /* hero orbs settle once on load (MASTER.md, Motion) */
  .orb-1, .orb-2{ animation: orb-settle 1600ms var(--ease-enter) both; }
  .orb-2{ animation-delay: 150ms; }
  @keyframes orb-settle{ from{ opacity: 0; transform: scale(0.92); } to{ opacity: 1; transform: scale(1); } }

  .wrap{ position: relative; z-index: 1; max-width: var(--maxw); margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }

  /* ---------- glass ---------- */
  .glass{
    position: relative; background: var(--glass); border-radius: 28px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(170%); backdrop-filter: blur(var(--blur)) saturate(170%);
  }
  .glass::before{
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(145deg, var(--edge) 0%, transparent 38%, transparent 62%, var(--edge) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    transition: opacity var(--t-standard) var(--ease);
  }
  .glass::after{
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(170deg, var(--sheen) 0%, transparent 30%);
  }
  .glass > *{ position: relative; z-index: 1; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    .glass{ background: var(--glass-fallback); }
  }
  .pill{ border-radius: 999px; }

  /* ---------- buttons ---------- */
  .btn{
    position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 24px; border-radius: 999px; border: 0; white-space: nowrap;
    font: 600 15px/1 var(--body); text-decoration: none; cursor: pointer;
    transition: transform var(--t-standard) var(--ease), background-color var(--t-standard) var(--ease),
                outline-offset var(--t-standard) var(--ease), outline-color var(--t-standard) var(--ease);
  }
  .btn-sm{ min-height: 44px; padding: 0 20px; font-size: 14px; }
  .btn-primary{ background: var(--accent); color: var(--on-accent); }
  .btn-primary::after{
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
    box-shadow: 0 8px 24px var(--accent-glow); opacity: 0.6; transition: opacity var(--t-standard) var(--ease);
  }
  .btn-glass{ color: var(--ink); }
  .btn-glass::before{ opacity: 0.7; }
  .btn:active{ transform: scale(0.97); transition-duration: var(--t-quick); }

  /* ---------- top bar ---------- */
  .topbar{ padding-top: 24px; }
  .topbar-inner{ display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 10px 10px 22px; }
  .brand{ display: flex; align-items: center; gap: 12px; text-decoration: none; border-radius: 999px; }
  .brand-badge{
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: var(--on-accent); font-family: var(--mono); font-size: 12px; font-weight: 500;
  }
  .brand-name{ font-family: var(--display); font-weight: 600; font-size: 17px; white-space: nowrap; }
  .nav{ display: flex; gap: 2px; }
  .navlink{
    color: var(--soft); text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 14px; border-radius: 999px;
    transition: color var(--t-standard) var(--ease), background-color var(--t-standard) var(--ease),
                outline-offset var(--t-standard) var(--ease), outline-color var(--t-standard) var(--ease);
  }
  @container page (max-width: 900px){ .nav{ display: none; } }

  /* ---------- hero ---------- */
  .hero{ position: relative; padding-top: 96px; }
  .hero-grid{ display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-end; }
  .hero-main{ flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; }
  .eyebrow{ align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 8px 16px; color: var(--soft); }
  .dot{ width: 8px; height: 8px; border-radius: 50%; background: var(--pass); flex-shrink: 0; }
  .target{ width: fit-content; max-width: 100%; }
  .hero-name{ font-size: clamp(56px, 9.2cqi, 132px); line-height: 0.92; letter-spacing: -0.035em; margin-top: 56px; }
  .hero-pitch{ font-size: clamp(19px, 1.9cqi, 24px); line-height: 1.45; max-width: 32ch; margin-top: 52px; }
  .stack{ list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip{ font-family: var(--mono); font-size: 12.5px; padding: 7px 14px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--hair); }
  .hero-cta{ display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px; }

  .facts{ flex: 1 1 320px; margin: 0; padding: 10px 28px; }
  .fact{ display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--hair); }
  .fact:last-child{ border-bottom: none; flex-direction: column; gap: 6px; }
  .fact dt{ font-family: var(--mono); font-size: 12.5px; color: var(--soft); }
  .fact dd{ margin: 0; font-weight: 600; text-align: right; }
  .fact:last-child dd{ text-align: left; font-weight: 500; }

  /* the one locator lens (MASTER.md, Motion): moved by runLens() */
  .lens{
    position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 2; pointer-events: none; opacity: 0;
    border: 1.5px solid var(--accent); background: var(--lens); border-radius: 20px;
    -webkit-backdrop-filter: saturate(180%); backdrop-filter: saturate(180%);
  }
  .lens[hidden]{ display: none; }
  .lens-tag{
    position: absolute; left: 10px; bottom: calc(100% + 6px); display: flex; align-items: center; gap: 8px;
    white-space: nowrap; max-width: calc(100cqi - 2 * var(--gutter) - 20px); overflow: hidden;
    font: 11.5px/1.4 var(--mono); padding: 3px 4px 3px 10px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent);
  }
  .lens-loc{ overflow: hidden; text-overflow: ellipsis; }
  .lens-loc::before{ content: attr(data-loc); }
  .lens-ok{
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    background: var(--pass); color: var(--bg); font-size: 10px; font-weight: 700; opacity: 0;
  }

  /* ---------- sections ---------- */
  .section{ padding-top: 112px; }
  .split{ display: flex; flex-wrap: wrap; gap: 24px 48px; }
  .split > h2, .split > .split-head{ flex: 1 1 240px; }
  .split > .split-body{ flex: 999 1 560px; min-width: 0; }
  .section h2{ font-size: 48px; line-height: 1.05; }
  .head-row{ display: flex; flex-wrap: wrap; gap: 16px 48px; align-items: flex-end; margin-bottom: 32px; }
  .head-row > h2{ flex: 1 1 240px; }
  .head-row > p{ flex: 999 1 560px; color: var(--soft); max-width: 62ch; }
  @container page (max-width: 600px){ .section h2{ font-size: 36px; } }

  /* about */
  .about-body{ display: flex; flex-direction: column; gap: 22px; max-width: 760px; }
  .lead{ font-size: 20px; line-height: 1.55; }
  .note{ padding: 22px 26px; border-radius: 22px; display: flex; flex-direction: column; gap: 8px; }

  /* projects */
  .projects{ padding: 10px; display: flex; flex-direction: column; gap: 2px; }
  .prow{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 12px 40px;
    padding: 26px 28px; border-radius: 22px; transition: background-color var(--t-standard) var(--ease);
  }
  .prow h3{ font-size: 26px; line-height: 1.15; transition: color var(--t-standard) var(--ease); }
  .prow-name{ display: flex; flex-direction: column; gap: 6px; }
  .prow-meta{ display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .status{ font-family: var(--mono); font-size: 12.5px; font-weight: 500; padding: 5px 12px; border-radius: 999px; color: var(--soft); background: var(--glass-strong); }
  .status.auto{ color: var(--pass); background: var(--pass-tint); }

  /* roadmap */
  .steps{ list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; }
  .step{ padding: 24px; border-radius: 24px; display: flex; flex-direction: column; gap: 12px; }
  .step.current{ box-shadow: 0 0 0 1.5px var(--accent), var(--shadow); }
  .step-top{ display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .step h3{ font-size: 22px; line-height: 1.2; }
  .step p{ color: var(--soft); font-size: 15px; }
  .step-status{ font-family: var(--mono); font-size: 12.5px; font-weight: 500; }
  .step-status.done{ color: var(--pass); }
  .step-status.doing{ color: var(--accent); }
  .step-status.next{ color: var(--soft); }

  /* experience */
  .exp{ padding: 32px 36px; display: flex; flex-direction: column; gap: 48px; }
  .exp-item{ display: flex; flex-direction: column; gap: 12px; }
  .exp-item h3{ font-size: 30px; line-height: 1.1; }
  .exp-item ul{ margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }

  /* contact */
  .contact{ margin-top: 112px; padding: clamp(32px, 6cqi, 80px); border-radius: 36px; display: flex; flex-direction: column; gap: 32px; }
  .contact h2{ font-size: clamp(44px, 6.4cqi, 88px); line-height: 1; letter-spacing: -0.03em; max-width: 15ch; }
  .contact-lede{ color: var(--soft); font-size: 18px; max-width: 58ch; }
  .tiles{ display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; }
  .tile{
    display: flex; flex-direction: column; gap: 6px; padding: 22px 24px; min-height: 44px; border-radius: 22px;
    background: var(--glass); border: 1px solid var(--hair); text-decoration: none; color: var(--ink);
    transition: transform var(--t-standard) var(--ease), background-color var(--t-standard) var(--ease),
                outline-offset var(--t-standard) var(--ease), outline-color var(--t-standard) var(--ease);
  }
  .tile .v{ overflow-wrap: anywhere; }
  .tile:active{ transform: scale(0.99); transition-duration: var(--t-quick); }
  .foot{ display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 32px 4px 40px; font-family: var(--mono); font-size: 12.5px; color: var(--soft); }
  .foot a{ color: var(--ink); }

  /* ---------- hover: only on devices that hover, only on clickable things ---------- */
  @media (hover: hover){
    .btn:hover, .navlink:hover, .prow:hover, .prow:hover h3, .tile:hover{ transition-duration: var(--t-quick); }
    .btn-primary:hover{ transform: translateY(-1px); }
    .btn-primary:hover::after{ opacity: 1; transition-duration: var(--t-quick); }
    .btn-glass:hover{ background: var(--glass-strong); }
    .btn-glass:hover::before{ opacity: 1; transition-duration: var(--t-quick); }
    .navlink:hover{ color: var(--ink); background: var(--glass-strong); }
    .prow:hover{ background: var(--glass-strong); }
    .prow:hover h3{ color: var(--accent); }
    .tile:hover{ background: var(--glass-strong); transform: translateY(-2px); }
    .btn-primary:hover:active{ transform: scale(0.97); }
    .tile:hover:active{ transform: translateY(-2px) scale(0.99); }
  }

  @media print{
    .orbs, .lens, .nav, .topbar .btn, .hero-cta{ display: none; }
    :root{ --bg: #fff; --ink: #111; --soft: #444; --glass: #fff; --glass-strong: #f4f4f4; --hair: #ccc; --shadow: none; }
    .glass{ backdrop-filter: none; -webkit-backdrop-filter: none; }
    .glass::before, .glass::after{ display: none; }
    .section{ padding-top: 32px; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *, *::before, *::after{ transition-duration: 0s !important; animation: none !important; }
    .btn:active, .tile:active, .btn-primary:hover, .tile:hover{ transform: none !important; }
    .lens{ display: none; }
  }
</style>
</head>

}

/* The locator lens: one lens steps through the hero targets like a test, once per load.
   Timings and curves come from MASTER.md (Motion). Progress is exposed on <html data-lens>
   (running / done / skipped) and #lens[data-step] for the tests. */
const EASE = 'cubic-bezier(0.2, 0, 0, 1)', ENTER = 'cubic-bezier(0.05, 0.7, 0.1, 1)',
      MOVE = 'cubic-bezier(0.4, 0, 0.2, 1)', EXIT = 'cubic-bezier(0.3, 0, 1, 1)';

async function runLens(){
  const root = document.documentElement, hero = $('top'), lens = $('lens');
  const skip = () => { root.dataset.lens = 'skipped'; };
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return skip(); } catch (e) {}
  if (!lens || !lens.animate) return skip();
  // Deep link (e.g. #projects): skip. Check the hash, not the scroll position: the browser's
  // jump to the anchor can land after fonts are ready (it did on the CI runner).
  if (location.hash && location.hash !== '#top') return skip();
  const h = hero.getBoundingClientRect();
  if (h.bottom < 0 || h.top > innerHeight) return skip();

  const targets = [...hero.querySelectorAll('.target')];
  const loc = lens.querySelector('.lens-loc'), ok = lens.querySelector('.lens-ok');
  const k = innerWidth < 600 ? 0.8 : 1, ms = v => v * k;
  const wait = v => new Promise(r => setTimeout(r, v));
  const box = t => {
    const a = t.getBoundingClientRect(), o = hero.getBoundingClientRect();
    return { left: `${a.left - o.left - 14}px`, top: `${a.top - o.top - 10}px`, width: `${a.width + 28}px`, height: `${a.height + 20}px` };
  };
  const pop = () => ok.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }],
                               { duration: ms(150), easing: EASE, fill: 'forwards' }).finished;

  root.dataset.lens = 'running';
  Object.assign(lens.style, box(targets[0]));
  loc.dataset.loc = targets[0].dataset.loc;
  lens.dataset.step = '1';
  lens.hidden = false;
  await wait(400);
  await lens.animate([{ opacity: 0, transform: 'scale(1.04)' }, { opacity: 1, transform: 'scale(1)' }],
                     { duration: ms(240), easing: ENTER, fill: 'forwards' }).finished;
  await wait(ms(120));
  await pop();

  for (let i = 1; i < targets.length; i++){
    await wait(ms(500));
    ok.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(90), fill: 'forwards' });
    loc.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms(120), fill: 'forwards' }).finished.then(() => {
      loc.dataset.loc = targets[i].dataset.loc;
      loc.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms(120), fill: 'forwards' });
    });
    const from = { left: lens.style.left, top: lens.style.top, width: lens.style.width, height: lens.style.height };
    const to = box(targets[i]);
    await lens.animate([from, to], { duration: ms(420), easing: MOVE }).finished;
    Object.assign(lens.style, to);
    lens.dataset.step = String(i + 1);
    await pop();
  }

  await wait(ms(500));
  await lens.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.98)' }],
                     { duration: ms(200), easing: EXIT, fill: 'forwards' }).finished;
  lens.hidden = true;
  lens.getAnimations({ subtree: true }).forEach(a => a.cancel());
  root.dataset.lens = 'done';
}

// Hide the resume buttons while resume.pdf isn't in the repo, instead of linking to a 404.
function checkResume(){
  const file = CONTENT.contact.resumeFile;
  if (!file || location.protocol === 'file:') return;
  fetch(file, { method: 'HEAD' })
    .then(r => { if (!r.ok) document.querySelectorAll('.js-resume').forEach(a => a.remove()); })
    .catch(() => {});
}

renderTopbar();
renderHero();
renderAbout();
renderProjects();
renderRoadmap();
renderExperience();
renderContact();
checkResume();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(runLens); else runLens();
